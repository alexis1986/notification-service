# Se suma a src/main/resources/application.properties (classpath:/config tiene precedencia).
# El scheduler no corre durante los tests: cada test dispara el despacho explícitamente.
notifications.dispatch.interval=PT1H
# Reintentos inmediatos para poder ejercitar el ciclo completo sin esperar
notifications.dispatch.max-attempts=3
notifications.dispatch.initial-backoff=PT0S
