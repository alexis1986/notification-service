# Perfil prod: sin defaults para la base (la conexión tiene que venir del entorno) y sin datos de demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# Detrás del Ingress: el header Location tiene que usar el host y esquema públicos (X-Forwarded-*)
server.forward-headers-strategy=framework

# Logs JSON para que el agregador del cluster los indexe sin parsear texto
logging.structured.format.console=ecs

# La API es pública como pieza de demo: el contrato y la consola quedan expuestos a propósito
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
