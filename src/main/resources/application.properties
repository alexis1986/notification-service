# Mail: los defaults apuntan a un SMTP local sin auth (ej. Mailpit en :1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
notifications.mail.from=${MAIL_FROM:no-reply@alexdevvv.com}

# Database: el esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DB_USERNAME:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# db/demo carga API Keys de demo; quitarla en entornos sin datos de demo (FLYWAY_LOCATIONS=classpath:db/migration)
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# Cache configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=apiKeys
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
