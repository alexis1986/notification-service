spring.application.name=notification-service

# Mail: los defaults apuntan a un SMTP local sin auth (ej. Mailpit en :1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
notifications.mail.from=${MAIL_FROM:no-reply@alexdevvv.com}
# smtp (default) o resend: API HTTP, para clusters donde el SMTP saliente está bloqueado
notifications.mail.provider=${MAIL_PROVIDER:smtp}
notifications.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
notifications.mail.resend.api-key=${RESEND_API_KEY:}

# El worker envía con la transacción del lote abierta: un proveedor colgado no puede retener las filas indefinidamente
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# Database: el esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${DB_USERNAME:notifications}
spring.datasource.password=${DB_PASSWORD:notifications}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# db/demo carga API Keys de demo; quitarla en entornos sin datos de demo (FLYWAY_LOCATIONS=classpath:db/migration)
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# Cache configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=apiKeys
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Despacho del outbox: cada cuánto se revisan pendientes, tamaño de lote y reintentos con backoff exponencial
notifications.dispatch.interval=${DISPATCH_INTERVAL:PT2S}
notifications.dispatch.batch-size=${DISPATCH_BATCH_SIZE:20}
notifications.dispatch.max-attempts=${DISPATCH_MAX_ATTEMPTS:5}
notifications.dispatch.initial-backoff=${DISPATCH_INITIAL_BACKOFF:PT10S}
notifications.dispatch.max-backoff=${DISPATCH_MAX_BACKOFF:PT10M}

# Actuator: health para los probes de Kubernetes. Liveness no depende de la base (reiniciar el pod no la arregla);
# readiness sí, para sacar el pod del balanceo mientras PostgreSQL no responde.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
# El proveedor de email no condiciona la salud del servicio: sus caídas las absorben los reintentos del outbox
management.health.mail.enabled=false
