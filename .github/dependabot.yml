# Las actions están fijadas por SHA: Dependabot las mantiene al día sin perder la inmutabilidad
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Una versión recién publicada es la ventana típica de un paquete comprometido
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Una versión recién publicada es la ventana típica de un paquete comprometido
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
